<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Ruscello Medicinal</title>
  <script type="module" crossorigin src="/ruscello-medicinal/assets/app-DwUyAdul.js"></script>
  <link rel="stylesheet" crossorigin href="/ruscello-medicinal/assets/app-Du2XoHcp.css">
</head>
<body>

    <header>
        <h1>Ruscello Medicinal</h1>
        <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav>
            <ul>
                <li><a href="index.html" data-link>Início</a></li>
                <li class="tem-dropdown">
                    <a href="projetos.html" data-link>Projetos</a>
                    <ul class="dropdown">
                        <li><a href="projetos.html#voluntariado" data-link>Voluntariado</a></li>
                        <li><a href="projetos.html#doacoes" data-link>Doações</a></li>
                    </ul>
                </li>
                <li><a href="cadastro.html" data-link>Cadastro</a></li>
                <li><a href="index.html#contato" data-link>Contato</a></li>
            </ul>
        </nav>
    </header>

    <main id="app">
        <section>
            <h2>Cadastro de Voluntário</h2>
            <form novalidate>
                <fieldset>
                    <legend>Dados pessoais</legend>

                    <div class="campo">
                        <label for="nome">Nome completo:</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="campo">
                        <label for="nascimento">Data de nascimento:</label>
                        <input type="date" id="nascimento" name="nascimento" required>
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <div class="campo">
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" name="endereco" required>
                    </div>

                    <div class="campo">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>

                    <div class="campo">
                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" name="estado" required>
                    </div>

                    <div class="campo">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                    </div>
                </fieldset>

                <button type="submit">Enviar</button>
            </form>
        </section>

        <div class="modal" id="modal-sucesso" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-sucesso">
            <div class="modal-conteudo">
                <button class="modal-fechar" onclick="fecharModal('modal-sucesso')" aria-label="Fechar modal">&times;</button>
                <h3 id="titulo-modal-sucesso">Cadastro enviado!</h3>
                <p>Obrigado por se voluntariar. Entraremos em contato em breve.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Ruscello Medicinal. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/locale/pt-br.js"></script>
</body>
</html>
